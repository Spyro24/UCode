[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ucode"
version = "0.1.0"
description = "A node-graph code editor: every file is a node with inputs and outputs"
readme = "roadmap.md"
requires-python = ">=3.10"
# Essentials only: the meta-package pulls in QtWebEngine (bundled Chromium), which
# constraint C2 in roadmap.md rules out.
dependencies = ["PySide6-Essentials>=6.6"]

[project.scripts]
ucode = "ucode.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
